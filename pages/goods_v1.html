<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>

<body>
    <div class="page-container">
        <header class="header">
            <div class="container">
                <h1 class="text-center my-4">Мои товары</h1>
            </div>

            <div class="grid text-center">
                <nav class="navbar navbar-expand-lg bg-body-tertiary">
                    <div class="container-fluid">
                        <a class="navbar-brand" href="#">Панель навигации: </a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                            aria-label="Переключатель навигации">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarNav">
                            <ul class="navbar-nav">
                                <li class="nav-item">
                                    <a class="nav-link active" aria-current="page" href="../index_v1.html">Главная</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="news.html">Новости</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="practices.html">Практики </a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link disabled" href="goods.html">Товары</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="contacts.html">Контакты</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>
            </div>
        </header>

        <main class="content">
            <div class="container goodsbox">
                <div class="row">
                    <!-- Товар 1 -->
                    <div class="col-md-4 col-sm-6 mb-4">
                        <div class="card goods-card h-100">
                            <img class="goods-image card-img-top" src="../images/goods1.jpg" alt="Мышка">
                            <div class="card-body goods-card-body d-flex flex-column">
                                <h3 class="goods-name card-title">Мяч</h3>
                                <p class="goods-price card-text">1000 рублей</p>
                                <button class="product-button btn btn-primary mt-auto">В корзину</button>
                            </div>
                        </div>
                    </div>

                    <!-- Товар 2 -->
                    <div class="col-md-4 col-sm-6 mb-4">
                        <div class="card goods-card h-100">
                            <img class="goods-image card-img-top" src="../images/goods2.jpg" alt="Клавиатура">
                            <div class="card-body goods-card-body d-flex flex-column">
                                <h3 class="goods-name card-title">Футбольные ворота</h3>
                                <p class="goods-price card-text">270000 рублей</p>
                                <button class="product-button btn btn-primary mt-auto">В корзину</button>
                            </div>
                        </div>
                    </div>

                    <!-- Товар 3 -->
                    <div class="col-md-4 col-sm-6 mb-4">
                        <div class="card goods-card h-100">
                            <img class="goods-image card-img-top" src="../images/goods3.jpg" alt="Наушники">
                            <div class="card-body goods-card-body d-flex flex-column">
                                <h3 class="goods-name card-title">Футбольная машина</h3>
                                <p class="goods-price card-text">1000000 рублей</p>
                                <button class="product-button btn btn-primary mt-auto">В корзину</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <p class="mb-0">Футер</p>
            </div>
        </footer>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

</html>
